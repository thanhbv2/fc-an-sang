<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cầu Thủ | FC ĂN SÁNG</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B1XSVS2NHJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-B1XSVS2NHJ');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
body{font-family:"Hanken Grotesk",sans-serif;background:#f7f9fb;color:#191c1e}
.font-anton{font-family:"Anton",sans-serif}
.card{background:#fff;border:1px solid #e0e3e5;border-radius:.5rem;padding:1rem}
.progress-ring{transform:rotate(-90deg)}
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-white border-b border-[#ddc1ae] shadow-sm">
  <div class="max-w-6xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-2 shrink-0">
      <img src="images/logo.jpg" alt="FC Ăn Sáng" class="w-10 h-10 rounded-full object-cover"/>
      <span class="font-anton text-xl text-[#ff8c00] italic tracking-wide">FC ĂN SÁNG</span>
    </a>
    <nav class="hidden md:flex gap-6 text-sm font-semibold uppercase tracking-wider text-[#564334]">
      <a href="index.html" class="hover:text-[#ff8c00] transition-colors">Bảng xếp hạng</a>
      <a href="player.html" class="text-[#ff8c00] border-b-2 border-[#ff8c00] pb-0.5">Cầu thủ</a>
      <a href="matches.html" class="hover:text-[#ff8c00] transition-colors">Kết quả</a>
      <a href="https://www.youtube.com/@fcansang" target="_blank" rel="noopener"
         class="flex items-center gap-1 hover:text-red-600 transition-colors">
        <span class="material-symbols-outlined text-base">smart_display</span>YouTube
      </a>
    </nav>
    <a href="index.html" class="text-sm text-[#564334] hover:text-[#ff8c00] flex items-center gap-1 transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      <span class="hidden sm:inline">Quay lại</span>
    </a>
  </div>
</header>

<!-- NOT FOUND -->
<div id="not-found" class="hidden max-w-6xl mx-auto px-4 py-20 text-center">
  <p class="font-anton text-5xl text-[#ff8c00] mb-2">404</p>
  <p class="text-[#564334] mb-4">Không tìm thấy cầu thủ này.</p>
  <a href="index.html" class="text-sm font-semibold text-[#ff8c00] underline">← Về bảng xếp hạng</a>
</div>

<!-- CONTENT -->
<div id="content" class="hidden">
  <!-- Hero -->
  <div class="bg-[#191c1e] text-white">
    <div class="max-w-6xl mx-auto px-4 md:px-8 py-8">
      <div class="flex flex-col sm:flex-row gap-4 items-center mb-6 text-center sm:text-left">
        <div id="hero-avatar" class="w-16 h-16 rounded-full bg-[#ff8c00] flex items-center justify-center shrink-0 text-white font-anton text-3xl"></div>
        <div class="flex-1 min-w-0">
          <div id="hero-rank" class="text-[#ff8c00] text-xs font-semibold uppercase tracking-widest mb-1"></div>
          <h1 id="hero-name" class="font-anton text-3xl md:text-5xl uppercase leading-normal break-words"></h1>
        </div>
      </div>
      <div id="hero-stats-bar" class="grid grid-cols-3 divide-x divide-gray-700 text-center">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <!-- Main grid -->
  <div class="max-w-6xl mx-auto px-4 md:px-8 py-6 grid grid-cols-1 md:grid-cols-12 gap-4">

    <!-- Sidebar -->
    <aside class="md:col-span-4 flex flex-col gap-4">

      <!-- Prev/Next -->
      <div class="flex gap-2">
        <a id="prev-link" href="#" class="flex-1 card text-center text-xs font-semibold text-[#564334] hover:text-[#ff8c00] hover:border-[#ff8c00] transition-colors truncate py-2">← <span id="prev-name">Trước</span></a>
        <a id="next-link" href="#" class="flex-1 card text-center text-xs font-semibold text-[#564334] hover:text-[#ff8c00] hover:border-[#ff8c00] transition-colors truncate py-2"><span id="next-name">Tiếp</span> →</a>
      </div>
    </aside>

    <!-- Right: 6 stat cards + player grid -->
    <div class="md:col-span-8 flex flex-col gap-4">
      <!-- Match History Timeline -->
      <div class="card">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-[#564334] mb-4">Lịch sử thi đấu</h3>
        <div id="match-timeline" class="relative border-l-2 border-gray-200 ml-2 pl-6">
          <!-- Timeline items will be injected here by JS -->
        </div>
      </div>

      <!-- Player grid -->
      <div class="card">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-[#564334] mb-3">Xem cầu thủ khác</h3>
        <div id="player-grid" class="flex flex-wrap gap-1.5"></div>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="bg-[#191c1e] border-t border-[#2d3133] text-gray-400 py-8 px-4 mt-4">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
    <div class="flex items-center gap-3">
      <img src="images/logo.jpg" alt="" class="w-10 h-10 rounded-full object-cover opacity-90"/>
      <div>
        <div class="font-anton text-[#ff8c00] text-lg italic">FC ĂN SÁNG</div>
        <div class="text-xs text-gray-500">© 2026 Ăn Sáng Premier League</div>
      </div>
    </div>
    <div class="flex gap-4 text-xs flex-wrap justify-center">
      <a href="index.html" class="hover:text-[#ff8c00] transition-colors">Bảng xếp hạng</a>
      <a href="player.html" class="hover:text-[#ff8c00] transition-colors">Cầu thủ</a>
      <a href="https://www.youtube.com/@fcansang" target="_blank" rel="noopener"
         class="flex items-center gap-1 text-red-500 hover:text-red-400 transition-colors">
        <span class="material-symbols-outlined text-sm">smart_display</span>YouTube
      </a>
    </div>
  </div>
</footer>

<script src="data/standings.js"></script>
<script src="data/matches.js"></script>
<script>
function slug(n){return n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

const id=new URLSearchParams(location.search).get('id');
const idx=STANDINGS.findIndex(p=>slug(p.name)===id);

if(idx===-1){
  document.getElementById('not-found').classList.remove('hidden');
}else{
  const p=STANDINGS[idx];
  document.getElementById('content').classList.remove('hidden');
  document.title=p.name+' | FC ĂN SÁNG';

  // Hero
  document.getElementById('hero-avatar').textContent=p.name.charAt(0);
  document.getElementById('hero-rank').textContent='#'+p.rank+' · Ăn Sáng Premier League 2026';
  document.getElementById('hero-name').textContent=p.name.toUpperCase();

  // Stats bar
  const totalWinLoss = p.w + p.l;
  const wr = totalWinLoss > 0 ? p.w / totalWinLoss : 0;
  const heroStatsBar = document.getElementById('hero-stats-bar');
  heroStatsBar.innerHTML = `
    <div>
      <div class="font-anton text-4xl md:text-5xl text-white">${p.g}</div>
      <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Trận</div>
    </div>
    <div>
      <div class="font-anton text-4xl md:text-5xl text-[#ff8c00]">${p.pts}</div>
      <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Điểm</div>
    </div>
    <div>
      <div class="font-anton text-4xl md:text-5xl text-white">${Math.round(wr * 100)}%</div>
      <div class="text-xs text-gray-400 uppercase tracking-widest mt-1">Tỷ lệ thắng</div>
    </div>
  `;

  // Prev/Next
  const prev=STANDINGS[idx-1],next=STANDINGS[idx+1];
  if(prev){document.getElementById('prev-name').textContent=prev.name;document.getElementById('prev-link').href='player.html?id='+slug(prev.name);}
  else{document.getElementById('prev-link').style.opacity='.3';document.getElementById('prev-link').onclick=e=>e.preventDefault();}
  if(next){document.getElementById('next-name').textContent=next.name;document.getElementById('next-link').href='player.html?id='+slug(next.name);}
  else{document.getElementById('next-link').style.opacity='.3';document.getElementById('next-link').onclick=e=>e.preventDefault();}

  // Player grid
  document.getElementById('player-grid').innerHTML=STANDINGS.map(pl=>
    `<a href="player.html?id=${slug(pl.name)}" class="px-2 py-1 text-xs rounded border ${pl.name===p.name?'bg-[#ff8c00] text-white border-[#ff8c00] font-semibold':'border-[#ddc1ae] text-[#564334] hover:border-[#ff8c00] hover:text-[#ff8c00]'} transition-colors">${pl.name}</a>`
  ).join('');

  function renderTimeline(playerName) {
    const timelineContainer = document.getElementById('match-timeline');
    if (typeof MATCHES === 'undefined' || !Array.isArray(MATCHES)) {
      timelineContainer.innerHTML = '<p class="text-xs text-gray-500">Không có dữ liệu trận đấu.</p>';
      return;
    }

    const playerMatches = MATCHES.filter(match => {
      const team1Players = match.team1?.players || match.home || [];
      const team2Players = match.team2?.players || match.away || [];
      return team1Players.includes(playerName) || team2Players.includes(playerName);
    });

    if (playerMatches.length === 0) {
      timelineContainer.innerHTML = '<p class="text-xs text-gray-500">Chưa thi đấu trận nào.</p>';
      return;
    }

    let timelineHtml = '';
    playerMatches.forEach(match => {
      const team1Players = match.team1?.players || match.home || [];
      const result = match.result;

      let playerResultText = '';
      let resultClass = '';

      const isInTeam1 = team1Players.includes(playerName);
      
      if (result === 'DRAW') {
        playerResultText = 'Hòa';
        resultClass = 'bg-yellow-400';
      } else if ((isInTeam1 && (result === 'D1_WIN' || result === 'home')) || (!isInTeam1 && (result === 'D2_WIN' || result === 'away'))) {
        playerResultText = 'Thắng';
        resultClass = 'bg-green-500';
      } else {
        playerResultText = 'Thua';
        resultClass = 'bg-red-500';
      }

      timelineHtml += `
        <div class="relative pb-6 last:pb-0">
          <div class="absolute -left-6 top-1 w-4 h-4 rounded-full ${resultClass} border-4 border-white"></div>
          <p class="font-semibold text-sm">${playerResultText}</p>
          <p class="text-xs text-gray-500">${new Date(match.date).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' })}</p>
        </div>
      `;
    });
    timelineContainer.innerHTML = timelineHtml;
  }
  renderTimeline(p.name);
}
</script>
</body>
</html>
